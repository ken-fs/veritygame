<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0c0518"/>
    </linearGradient>
    <radialGradient id="sphere" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Verity yellow sphere -->
  <circle cx="16" cy="16" r="9.5" fill="url(#sphere)"/>
  <!-- single unsettling eye -->
  <circle cx="16" cy="14.5" r="3.2" fill="#1a1030"/>
  <circle cx="17" cy="13.5" r="1" fill="#fde047"/>
  <!-- smile -->
  <path d="M11.5 20.5 Q16 23.5 20.5 20.5" stroke="#1a1030" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
